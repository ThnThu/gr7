[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection"
version = "0.1.0"
description = "NEU-DET data preparation pipeline for YOLOv8 object detection"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
detection = "detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: performance smoke tests excluded from the default suite",
]
